# SP-5 isolated grok config (GROK_HOME=<scratch>/homes/grok/.grok).
# No xAI credentials exist in this home. The only model is local-coder via LiteLLM on loopback.
# The LiteLLM key is NOT stored here: it is read from env LITELLM_API_KEY (set by run-grok.sh).

disable_web_search = true

[cli]
auto_update = false
show_tips = false
use_leader = false
session_registry = false

[marketplace]
# written by grok itself in a real home once it has auto-installed the official
# marketplace; pre-set so the isolated home never tries to git-clone it
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[models]
default = "local-coder"
allowed_models = ["local-coder"]
session_summary = "local-coder"
prompt_suggestion = "local-coder"

[model.local-coder]
model = "local-coder"
base_url = "http://127.0.0.1:10400/v1"
api_backend = "chat_completions"
name = "local-coder (LiteLLM -> vLLM qwen3.8-27b)"
env_key = "LITELLM_API_KEY"
context_window = 65536
max_completion_tokens = 8192

[features]
telemetry = "off"
feedback = false
feedback_trace_card = false
codebase_indexing = false
lsp_tools = false
remote_fetch = false
managed_config = false
campaigns = false
session_recap = false
title_refresh = false
turn_summary = false
voice_mode = false
image_gen = false
video_gen = false
web_fetch = false
backend_tools = false
non_git_warning = false
support_permission = false


[telemetry]
events_url = ""
events_api_key = ""
mixpanel_token = ""
mixpanel_enabled = false
trace_upload = false
otel_enabled = false

[harness]
wait_for_uploads = false

[relay]
enabled = false

[managed_mcps]
enabled = false

[subagents]
enabled = false

[memory]
enabled = false

[ui]
fork_secondary_model = "local-coder"
prompt_suggestions = false
yolo = false

[compat.claude]
agents = false
hooks = false
mcps = false
rules = false
skills = false

[compat.cursor]
agents = false
hooks = false
mcps = false
rules = false
skills = false

[shell_environment_policy]
exclude = ["LITELLM_API_KEY"]
