<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-labelledby="t d">
  <title id="t">Om — the Oh My AGI mascot</title>
  <desc id="d">A small golden drop of light with a face, floating and blinking, with sparks circling it and a ribbon of light around it.</desc>
  <defs>
    <radialGradient id="body" cx="45%" cy="62%" r="62%">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.28" stop-color="#ffe08a"/>
      <stop offset="0.68" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#e07a12"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc94d" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#ff9f1c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .float  { animation: float 4s ease-in-out infinite; }
    .halo   { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .shadow { animation: shadow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .eye    { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
    .flick  { animation: flick 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
    .orbit  { animation: spin 9s linear infinite; transform-origin: 120px 140px; }
    .orbit2 { animation: spin 13s linear infinite reverse; transform-origin: 120px 140px; }
    .ribbon { stroke-dasharray: 70 260; animation: flow 3.2s linear infinite; }
    .spark  { animation: twinkle 2.4s ease-in-out infinite; }
    .spark.b { animation-delay: .8s; }
    .spark.c { animation-delay: 1.6s; }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes pulse   { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes shadow  { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(.78); opacity: .2; } }
    @keyframes blink   { 0%,90%,100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } 96% { transform: scaleY(1); } }
    @keyframes flick   { from { transform: rotate(-4deg) scaleY(1); } to { transform: rotate(4deg) scaleY(1.06); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes flow    { to { stroke-dashoffset: -330; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .float, .halo, .shadow, .eye, .flick, .orbit, .orbit2, .ribbon, .spark { animation: none; }
    }
  </style>

  <!-- the shadow on the ground, smaller when Om floats up -->
  <ellipse class="shadow" cx="120" cy="238" rx="42" ry="7" fill="#0b1a33"/>

  <g class="float">
    <!-- glow -->
    <circle class="halo" cx="120" cy="140" r="96" fill="url(#halo)"/>

    <!-- sparks circling -->
    <g class="orbit">
      <circle class="spark" cx="120" cy="52" r="3.2" fill="#ffe08a"/>
      <circle class="spark b" cx="206" cy="150" r="2.4" fill="#5eead4"/>
      <circle class="spark c" cx="52" cy="186" r="2.8" fill="#ffd166"/>
    </g>
    <g class="orbit2">
      <circle class="spark b" cx="190" cy="80" r="2" fill="#fff3c4"/>
      <circle class="spark" cx="44" cy="110" r="2.2" fill="#5eead4"/>
    </g>

    <!-- ribbon of light behind -->
    <ellipse cx="120" cy="150" rx="78" ry="22" fill="none" stroke="url(#ribbon)" stroke-width="3" transform="rotate(-14 120 150)" opacity=".55"/>

    <!-- body: a drop of light, its tip a small flame -->
    <g class="flick">
      <path d="M120 36 C131 66 174 98 174 146 A54 54 0 0 1 66 146 C66 98 109 66 120 36 Z" fill="url(#body)"/>
      <path d="M120 36 C131 66 174 98 174 146 A54 54 0 0 1 66 146 C66 98 109 66 120 36 Z" fill="none" stroke="#fff3c4" stroke-opacity=".55" stroke-width="1.5"/>
      <!-- inner swirl, like the logo -->
      <path d="M92 168 C110 186 150 180 156 150 C160 130 140 116 124 124" fill="none" stroke="#fffbe8" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
      <!-- shine -->
      <ellipse cx="96" cy="118" rx="9" ry="16" fill="#fffbe8" opacity=".7" transform="rotate(24 96 118)"/>
    </g>

    <!-- face -->
    <g>
      <ellipse class="eye" cx="104" cy="146" rx="6" ry="8.5" fill="#3b2306"/>
      <ellipse class="eye" cx="136" cy="146" rx="6" ry="8.5" fill="#3b2306"/>
      <circle cx="106.2" cy="142.5" r="2" fill="#fffbe8"/>
      <circle cx="138.2" cy="142.5" r="2" fill="#fffbe8"/>
      <ellipse cx="92" cy="162" rx="7" ry="4" fill="#ff7a45" opacity=".35"/>
      <ellipse cx="148" cy="162" rx="7" ry="4" fill="#ff7a45" opacity=".35"/>
      <path d="M112 164 Q120 172 128 164" fill="none" stroke="#3b2306" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- ribbon of light in front -->
    <ellipse class="ribbon" cx="120" cy="150" rx="78" ry="22" fill="none" stroke="url(#ribbon)" stroke-width="3" stroke-linecap="round" transform="rotate(-14 120 150)"/>
  </g>
</svg>
